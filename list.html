<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>音声一覧 | English Audio</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./list.css">
</head>
<body>
  <main class="player-card list-card">
    <p class="eyebrow">English Audio</p>
    <h1>音声一覧</h1>
    <p class="subtitle">教材のタイトルを選ぶと、音声ページが開きます。</p>
    <div class="filters">
      <label>タイトルで検索<input id="search" type="search" placeholder="例：Climate Change" autocomplete="off"></label>
      <label>年度<select id="year"><option value="">すべての年度</option></select></label>
    </div>
    <p id="status" class="subtitle" role="status">一覧を読み込んでいます…</p>
    <div id="tracks"></div>
    <noscript><p>一覧を表示するにはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <script src="./list.js"></script>
</body>
</html>
