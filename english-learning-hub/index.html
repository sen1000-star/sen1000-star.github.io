<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#dcecff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="English Hub">
  <title>English Learning Hub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-v3-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-v3-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eff6ff; color: #203959; font-family: system-ui, sans-serif; }
    main { width: min(100%, 440px); text-align: center; }
    img { width: 120px; height: 120px; border-radius: 26px; }
    h1 { font-size: 26px; line-height: 1.3; }
    p { line-height: 1.8; }
    a { display: block; padding: 16px; border-radius: 16px; background: #315b91; color: white; text-decoration: none; font-weight: 700; }
    .hint { font-size: 14px; color: #526985; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-v3-192.png" alt="" width="120" height="120">
    <h1>English Learning Hub</h1>
    <p>出会った表現を、自分の言葉に。</p>
    <a href="https://script.google.com/macros/s/AKfycbwOx8h2V6IAhnD_mBKW7ST69_ErPCZbz7dRfKM9mt9Lmfg1jHVTry1TAcVkDGEVdQUO/exec">アプリを開く</a>
    <p class="hint">このページをホーム画面に追加してください。<br>iPhone：Safariの共有メニュー → ホーム画面に追加<br>Android：Chromeのメニュー → ホーム画面に追加</p>
  </main>
</body>
</html>
