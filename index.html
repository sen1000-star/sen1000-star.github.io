<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>English Audio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="player-card" aria-live="polite">
    <p class="eyebrow">English Audio</p>
    <h1 id="track-title">音声を読み込んでいます</h1>
    <p id="track-subtitle" class="subtitle"></p>

    <section id="player-section" class="player-section" hidden>
      <audio id="audio" controls preload="metadata"></audio>

      <div class="speed-controls" aria-label="再生速度">
        <span>再生速度</span>
        <button type="button" data-speed="0.75">0.75×</button>
        <button type="button" data-speed="1" class="active">1×</button>
        <button type="button" data-speed="1.25">1.25×</button>
      </div>
    </section>

    <p id="message" class="message"></p>
  </main>

  <script src="./player.js"></script>
</body>
</html>
